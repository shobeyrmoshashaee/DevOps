apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-rwx-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nfs-rwx-demo
  template:
    metadata:
      labels:
        app: nfs-rwx-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: writer
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              while true; do
                echo "$(date -Iseconds) $(hostname)" >> /data/replicas.log
                sleep 30
              done
          volumeMounts:
            - name: shared-data
              mountPath: /data
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: nfs-dynamic-claim
