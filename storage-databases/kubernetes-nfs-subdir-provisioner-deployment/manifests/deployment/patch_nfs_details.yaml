apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-client-provisioner
spec:
  template:
    spec:
      containers:
        - name: nfs-client-provisioner
          env:
            - name: NFS_SERVER
              value: 192.0.2.50
            - name: NFS_PATH
              value: /mnt/nfs/kubernetes
            - name: NFS_DEFAULT_MODE
              value: "0770"
            - name: NFS_DEFAULT_UID
              value: "65534"
            - name: NFS_DEFAULT_GID
              value: "65534"
      volumes:
        - name: nfs-client-root
          nfs:
            server: 192.0.2.50
            path: /mnt/nfs/kubernetes
