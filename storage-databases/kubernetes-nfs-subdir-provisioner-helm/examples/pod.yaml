apiVersion: v1
kind: Pod
metadata:
  name: nfs-rwx-test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 65534
    fsGroup: 65534
  containers:
    - name: writer
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - |
          date -Iseconds >> /data/healthcheck.txt
          exec tail -f /dev/null
      volumeMounts:
        - name: shared-data
          mountPath: /data
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
  volumes:
    - name: shared-data
      persistentVolumeClaim:
        claimName: nfs-dynamic-test
